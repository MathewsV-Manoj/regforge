name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Build the site from the corpus
        # Every part in the corpus becomes a page. This is the distribution
        # strategy: engineers search for "BME280 register map", not for a
        # datasheet-to-driver tool, and the corpus is already the best
        # structured answer to that query.
        run: python tools/build_site.py --out ./site

      - name: Sanity-check the output
        run: |
          set -e
          test -f site/index.html
          test -f site/sitemap.xml
          pages=$(ls site/parts/*.html | wc -l)
          echo "built $pages part pages"
          test "$pages" -gt 0
          # Every part in the corpus must have a page, or the sitemap lies.
          parts=$(ls corpus/*/*.json | wc -l)
          test "$pages" -eq "$parts"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
